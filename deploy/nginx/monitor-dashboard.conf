# Monitor Dashboard nginx configuration
#
# Deploy to: /etc/nginx/sites-available/monitor-dashboard
# Enable:    ln -s /etc/nginx/sites-available/monitor-dashboard /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name dashboard.example.com;

    # Static frontend files
    root /usr/share/monitor-dashboard/public;
    index index.html;

    # API reverse proxy to C backend
    location /api/v1/ {
        proxy_pass http://127.0.0.1:18080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long polling or future operations
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # SPA fallback: serve index.html for all non-API routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security: hide backend version
    proxy_hide_header X-Powered-By;

    # Logging
    access_log /var/log/nginx/monitor-dashboard-access.log;
    error_log  /var/log/nginx/monitor-dashboard-error.log;
}
